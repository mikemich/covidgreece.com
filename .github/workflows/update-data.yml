name: Update data

# WHO publishes weekly figures early in the week; refresh every Wednesday.
on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and rebuild data
        run: python scripts/build_data.py
      - name: Commit if the numbers changed
        run: |
          # build_data.py keeps generated_at stable when nothing changed
          if git diff --quiet -- docs/data; then
            echo "No new data."
            git checkout -- docs/data
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "data: weekly refresh ($(date -u +%Y-%m-%d))"
          git push
